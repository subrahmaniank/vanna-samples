[project]
name = "vanna-samples"
version = "2.0.0"
description = "Vanna 2.0 Samples with DuckDB, Snowflake, Postgres, Qdrant, ChromaDB, FAISS, and AWS Bedrock Mantle / Azure OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0",
    "pydantic>=2.10.0,<2.11.0",
    "starlette>=0.40.0,<0.48.0",
    "fastapi>=0.115.0",
    "mcp>=1.12.0,<2.0.0",
    "fastmcp>=2.11.0",
    "uvicorn>=0.34.0",
    "vanna[fastapi,openai,snowflake]>=2.0.0",
    "snowflake-connector-python[pandas]>=3.12.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "chromadb>=1.0.0",
    "faiss-cpu>=1.8.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
]
