[project]
name = "vanna-samples"
version = "2.0.0"
description = "Vanna 2.0 Samples with DuckDB, Snowflake, Postgres, Qdrant, ChromaDB, FAISS, and pluggable LLMs (OpenRouter, custom, Bedrock Mantle, Azure OpenAI, OpenAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0",
    "truststore>=0.10.4",
    "pydantic>=2.11.7,<2.14.0",
    "starlette>=0.40.0,<0.48.0",
    "fastapi>=0.115.0",
    "mcp>=1.27.0,<2.0.0",
    "fastmcp>=2.11.0",
    "uvicorn>=0.34.0",
    "vanna[fastapi,openai,snowflake]>=2.0.0",
    "snowflake-connector-python[pandas]>=3.12.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "chromadb>=1.0.0",
    "faiss-cpu>=1.8.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.13",
]
